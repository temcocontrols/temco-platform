name: Release

# A tag is the release: pushing `v1.2.3` builds the installers for the three platforms and attaches them to a draft
# GitHub Release named after the tag. Nothing is published until a person opens the draft and presses Publish.
#
# Why a tag and not a branch: a tag does not move, so a release can be rebuilt from exactly the source that shipped.
# The tag must agree with `version` in package.json — the installer takes its version from there, not from the tag, and
# a release called v1.2.3 that installs itself as 1.144.0 is one nobody can support. `guard` below fails the run when
# the two disagree, before anything expensive starts.
#
# How to cut a release:
#   1. bump `version` in package.json, commit it
#   2. git tag -a v<that version> -m "Temco Platform <that version>"
#   3. git push origin v<that version>
# To rebuild a tag that already exists, run this workflow by hand with its name.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build, e.g. v1.144.0'
        required: true

permissions:
  contents: write

# The branch the product lives on. `main` mirrors microsoft/vscode and carries none of this repository's work, so a
# release must be cut from here — the guard refuses a tag that is not on it.
env:
  RELEASE_BRANCH: t3000-platform

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # The tag and package.json must agree, or the installer lies about which release it is.
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 1
      - name: Check the tag against package.json
        id: check
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          version="$(node -p "require('./package.json').version")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$tag" != "v$version" ]; then
            echo "::error::Tag $tag does not match package.json version $version."
            echo "Bump \`version\` in package.json to ${tag#v}, commit it, and tag that commit — or tag v$version."
            exit 1
          fi
          echo "Building $tag ($version)."

      # `main` is a mirror of microsoft/vscode, so a tag on it would build something with none of this product in it.
      - name: Check the tag is on the release branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.check.outputs.tag }}
        run: |
          set -euo pipefail
          status="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${RELEASE_BRANCH}...${TAG}" --jq .status)"
          # `compare/<base>...<head>` reports where **head** is, and head here is the tag:
          #   identical — the tag is the branch tip
          #   behind    — the tag is an ancestor of the branch tip, so it *is* on the branch and the branch has moved on
          #   ahead     — the tag carries commits the branch does not have, so it is *not* on the branch
          #   diverged  — neither
          # `behind` therefore has to pass: cutting a release and then committing the fix that release needed is how a
          # pipeline is repaired, and the tag still names a commit this branch contains.
          case "$status" in
            identical|behind) echo "Tag $TAG is on $RELEASE_BRANCH." ;;
            *)
              echo "::error::Tag $TAG is not on $RELEASE_BRANCH (compare status: $status)."
              echo "Releases are cut from $RELEASE_BRANCH; main mirrors upstream and is never released from."
              exit 1
              ;;
          esac

  build:
    needs: guard
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    env:
      # Packaging downloads the built-in extensions from **GitHub Releases** (`bundle-marketplace-extensions-build`), and
      # that call is authenticated only when this is set. Without it a hosted runner shares GitHub's unauthenticated
      # allowance of 60 requests an hour, so the third or fourth extension comes back `403 (you may be rate limited)` and
      # the whole packaging step dies about eleven seconds in — which is exactly what the first run of this workflow did.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # `@vscode/policy-watcher` builds from source on the macOS runner, and its default deployment target
      # (below 10.13) makes libc++ reject std::get<...>. The Electron base this product ships needs 11 or newer anyway.
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows x64
            platform: win32
            arch: x64
          - os: ubuntu-latest
            label: Linux x64
            platform: linux
            arch: x64
          - os: macos-14
            label: macOS arm64
            platform: darwin
            arch: arm64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.guard.outputs.tag }}
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # The packaging steps run the repository's own scripts; a missing toolchain fails later and less clearly.
      - name: Install Linux build tools
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libx11-dev libx11-xcb-dev libxkbfile-dev \
            libnotify-bin libkrb5-dev fakeroot dpkg-dev rpm

      - name: Install dependencies
        # Twice at most: the registry occasionally drops a tarball, and a release should not fail on that.
        run: npm ci || npm ci
        env:
          # Packaging downloads the Electron binary itself; Playwright is not needed to build.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - name: Prepare Electron types
        run: node build/npm/electronTypes.ts

      # The extensions this fork adds ship inside the app: `out/**` is what the package copies, and the webview bundles
      # are esbuild output under each module's own `out/` — which the gulp packaging chain does not produce.
      # Built-in marketplace extensions need no step here; the packaging task downloads and bundles them itself.
      - name: Compile extensions and webviews
        run: |
          npm run gulp compile-extensions
          npm run build-webviews

      - name: Package (Windows)
        if: matrix.platform == 'win32'
        run: |
          npm run gulp vscode-win32-x64-min
          npm run gulp vscode-win32-x64-user-setup

      - name: Package (Linux)
        if: matrix.platform == 'linux'
        run: |
          npm run gulp vscode-linux-x64-min
          npm run gulp vscode-linux-x64-prepare-deb
          npm run gulp vscode-linux-x64-build-deb

      - name: Package (macOS)
        if: matrix.platform == 'darwin'
        run: |
          npm run gulp vscode-darwin-arm64-min

      # One staging folder per platform, so the release job has one shape to collect.
      - name: Stage (Windows)
        if: matrix.platform == 'win32'
        shell: pwsh
        run: |
          $version = "${{ needs.guard.outputs.version }}"
          New-Item -ItemType Directory -Force staging | Out-Null
          Compress-Archive -Path ../VSCode-win32-x64 -DestinationPath "staging/TemcoPlatform-win32-x64-$version.zip"
          Get-ChildItem .build/win32-x64/user-setup -Filter *.exe | Copy-Item -Destination staging
          Get-ChildItem staging | Select-Object Name, Length

      - name: Stage (Linux)
        if: matrix.platform == 'linux'
        run: |
          set -euo pipefail
          version="${{ needs.guard.outputs.version }}"
          mkdir -p staging
          tar -czf "staging/temco-platform-linux-x64-$version.tar.gz" -C .. VSCode-linux-x64
          deb="$(find .build/linux/deb -name '*.deb' -type f | head -n 1)"
          if [ -z "$deb" ]; then echo "::error::The .deb build produced no package."; exit 1; fi
          cp "$deb" "staging/temco-platform_${version}_amd64.deb"
          ls -l staging

      - name: Stage (macOS)
        if: matrix.platform == 'darwin'
        run: |
          set -euo pipefail
          version="${{ needs.guard.outputs.version }}"
          mkdir -p staging
          app="$(find ../VSCode-darwin-arm64 -maxdepth 1 -name '*.app' | head -n 1)"
          if [ -z "$app" ]; then echo "::error::The macOS build produced no .app bundle."; exit 1; fi
          ditto -c -k --keepParent "$app" "staging/TemcoPlatform-darwin-arm64-$version.zip"
          ls -l staging

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-${{ matrix.arch }}
          path: staging/*
          if-no-files-found: error
          retention-days: 14

  release:
    needs: [guard, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Write the release notes
        run: |
          cat > release/NOTES.md <<'EOF'
          Built from the tag by GitHub Actions. Every asset is unsigned: there is no code-signing certificate for this
          application yet, so Windows shows "unknown publisher" on first run and macOS asks for a right-click → Open
          (or `xattr -d com.apple.quarantine`). These are the files this build produced:

          - `TemcoPlatform-win32-x64-<version>.zip` — run `Temco Platform.exe` from the unpacked folder
          - a Windows installer `.exe` — per-user install, no admin rights
          - `temco-platform_<version>_amd64.deb` and `temco-platform-linux-x64-<version>.tar.gz`
          - `TemcoPlatform-darwin-arm64-<version>.zip` — Apple silicon only

          Nothing here updates itself: a new version is a new download.
          EOF

      # A draft, so the files can be checked before anyone is pointed at them.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.guard.outputs.tag }}
          name: Temco Platform ${{ needs.guard.outputs.version }}
          body_path: release/NOTES.md
          files: |
            release/*.exe
            release/*.zip
            release/*.deb
            release/*.tar.gz
          draft: true
          fail_on_unmatched_files: true
