name: Release

# A tag is the release: pushing `v1.2.3` builds the installer for Windows, the packages for Linux, and attaches them to
# a draft GitHub Release named after the tag. Nothing is published until a person opens the draft and presses Publish.
#
# Why a tag and not a branch: a tag does not move, so a release can be rebuilt from exactly the source that shipped.
# The tag must agree with `version` in package.json — the installer takes its version from there, not from the tag, and
# a release called v1.2.3 that installs itself as 1.144.0 is one nobody can support. `guard` below fails the run when
# the two disagree, before anything expensive starts.
#
# How to cut a release:
#   1. bump `version` in package.json, commit it
#   2. git tag -a v<that version> -m "Temco Platform <that version>"
#   3. git push origin v<that version>
# To rebuild a tag that already exists, run this workflow by hand with its name.
#
# macOS arm64 is built only when asked for (`workflow_dispatch` with `macos` set to true): see the input's comment.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build, e.g. v1.144.0'
        required: true
      # Apple silicon is opt-in. This account has not been handed a `macos-15` runner on any of seven attempts — the
      # job is cancelled at the queue's fifteen-minute limit with "The job was not acquired by Runner of type hosted"
      # — while Windows and Linux have built every time. A tag therefore builds the two platforms that work and is
      # released without waiting; set this to `true` when a runner is available and the arm64 zip is wanted too.
      macos:
        description: 'Also build the macOS arm64 package'
        type: boolean
        default: false

permissions:
  contents: write

# The branch the product lives on. `main` mirrors microsoft/vscode and carries none of this repository's work, so a
# release must be cut from here — the guard refuses a tag that is not on it.
env:
  RELEASE_BRANCH: t3000-platform

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # The tag and package.json must agree, or the installer lies about which release it is.
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      version: ${{ steps.check.outputs.version }}
      matrix: ${{ steps.platforms.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 1
      - name: Check the tag against package.json
        id: check
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          version="$(node -p "require('./package.json').version")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$tag" != "v$version" ]; then
            echo "::error::Tag $tag does not match package.json version $version."
            echo "Bump \`version\` in package.json to ${tag#v}, commit it, and tag that commit — or tag v$version."
            exit 1
          fi
          echo "Building $tag ($version)."

      # `main` is a mirror of microsoft/vscode, so a tag on it would build something with none of this product in it.
      - name: Check the tag is on the release branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.check.outputs.tag }}
        run: |
          set -euo pipefail
          status="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${RELEASE_BRANCH}...${TAG}" --jq .status)"
          # `compare/<base>...<head>` reports where **head** is, and head here is the tag:
          #   identical — the tag is the branch tip
          #   behind    — the tag is an ancestor of the branch tip, so it *is* on the branch and the branch has moved on
          #   ahead     — the tag carries commits the branch does not have, so it is *not* on the branch
          #   diverged  — neither
          # `behind` therefore has to pass: cutting a release and then committing the fix that release needed is how a
          # pipeline is repaired, and the tag still names a commit this branch contains.
          case "$status" in
            identical|behind) echo "Tag $TAG is on $RELEASE_BRANCH." ;;
            *)
              echo "::error::Tag $TAG is not on $RELEASE_BRANCH (compare status: $status)."
              echo "Releases are cut from $RELEASE_BRANCH; main mirrors upstream and is never released from."
              exit 1
              ;;
          esac

      # Which platforms this run builds, handed to `build` as its matrix. It is computed here rather than written out
      # once so that one list of steps can serve two shapes: the two that always build, and those two plus macOS.
      #
      # The Linux build is pinned to 22.04: `vscode-linux-x64-prepare-deb` computes the package's shared-library
      # dependencies with Chromium's vendored `dpkg-shlibdeps.pl`, which calls the *system* `Dpkg::Shlibs` Perl
      # modules. Under dpkg 1.22 (Ubuntu 24.04, `ubuntu-latest`) that combination dies in `SymbolFile.pm` with
      # "Can't use an undefined value as a HASH reference".
      #
      # `macos-15` is the Apple silicon image this repository asks for: `macos-14` (and every `-large`/`-xlarge`
      # variant) is refused before a runner is assigned — "The configuration 'macos-14-arm64-us-default' is not
      # supported" — and `macos-26` queues exactly like `macos-15`, so the newer image buys nothing.
      - name: Decide which platforms this run builds
        id: platforms
        env:
          WANT_MACOS: ${{ github.event.inputs.macos }}
        run: |
          set -euo pipefail
          include='{"os":"windows-latest","label":"Windows x64","platform":"win32","arch":"x64"}'
          include="$include"',{"os":"ubuntu-22.04","label":"Linux x64","platform":"linux","arch":"x64"}'
          if [ "${WANT_MACOS:-false}" = "true" ]; then
            include="$include"',{"os":"macos-15","label":"macOS arm64","platform":"darwin","arch":"arm64","optional":true}'
          fi
          echo "matrix={\"include\":[$include]}" >> "$GITHUB_OUTPUT"
          echo "This run builds: $include"

  build:
    needs: guard
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    # `optional` marks a platform whose package is a bonus rather than a requirement: a job that fails does not fail the
    # release. It cannot cover a job GitHub *cancels* while it waits for a runner that is never handed out — that ends
    # the run as a failure anyway (run 42890122529) — which is why macOS is opt-in below and why the `release` job says
    # outright that it may not be skipped.
    continue-on-error: ${{ matrix.optional == true }}
    timeout-minutes: 150
    env:
      # Packaging downloads the built-in extensions from **GitHub Releases** (`bundle-marketplace-extensions-build`), and
      # that call is authenticated only when this is set. Without it a hosted runner shares GitHub's unauthenticated
      # allowance of 60 requests an hour, so the third or fourth extension comes back `403 (you may be rate limited)` and
      # the whole packaging step dies about eleven seconds in — which is exactly what the first run of this workflow did.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # `@vscode/policy-watcher` builds from source on the macOS runner, and its default deployment target
      # (below 10.13) makes libc++ reject std::get<...>. The Electron base this product ships needs 11 or newer anyway.
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    strategy:
      fail-fast: false
      # One entry per platform, decided by `guard` (see "Decide which platforms this run builds"): a tag builds
      # Windows and Linux, and a run asked for macOS builds those and macOS. The steps below are the same either way,
      # and each one that is platform-specific says which platform it is for.
      matrix: ${{ fromJSON(needs.guard.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.guard.outputs.tag }}
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # The assistant's tool server is a .NET program (`tools/temco-mcp`). It is built here and attached to the
      # release as `temco-mcp-<rid>.tar.gz` — the name `extensions/temco-ai/src/ai/catalog.ts` asks for — rather
      # than bundled into the application: it is downloaded on first use, like a runtime, and verified the same way.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # The packaging steps run the repository's own scripts; a missing toolchain fails later and less clearly.
      #
      # `g++-13` on purpose: Electron 43 ships V8 headers the image's default g++ 11 cannot parse — `native-keymap` dies
      # with "expected ';' before 'public'" in `v8-primitive.h` while `npm ci` compiles it — and g++ 13 is what compiles
      # it on a 24.04 runner. The 22.04 default `dpkg` is what `prepare-deb` needs (see the matrix comment above).
      - name: Install Linux build tools
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libx11-dev libx11-xcb-dev libxkbfile-dev \
            libnotify-bin libkrb5-dev fakeroot dpkg-dev rpm \
            software-properties-common
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get install -y --no-install-recommends gcc-13 g++-13
          echo "CC=gcc-13" >> "$GITHUB_ENV"
          echo "CXX=g++-13" >> "$GITHUB_ENV"

      # `npm ci` compiles the native modules from source (`.npmrc` sets `build_from_source`), and gyp takes the macOS
      # deployment target from its own settings — `MACOSX_DEPLOYMENT_TARGET` above is read by Xcode's tools, not by gyp's
      # make generator, so on its own it changes nothing. The generator does start from the environment (`CXXFLAGS.target
      # ?= $(CPPFLAGS) $(CXXFLAGS)` in its Makefile) and appends it *after* the flags gyp computed, so a
      # `-mmacosx-version-min` here is the one the compiler obeys. Without it `@vscode/policy-watcher` fails to build with
      # "'std::get<...>' is unavailable: introduced in macOS 10.13", which is exactly how the macOS job died.
      - name: Set the macOS deployment target for node-gyp
        if: matrix.platform == 'darwin'
        run: |
          echo "CFLAGS=-mmacosx-version-min=${MACOSX_DEPLOYMENT_TARGET}" >> "$GITHUB_ENV"
          echo "CXXFLAGS=-mmacosx-version-min=${MACOSX_DEPLOYMENT_TARGET}" >> "$GITHUB_ENV"

      - name: Install dependencies
        # Twice at most: the registry occasionally drops a tarball, and a release should not fail on that.
        run: npm ci || npm ci
        env:
          # Packaging downloads the Electron binary itself; Playwright is not needed to build.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - name: Prepare Electron types
        run: node build/npm/electronTypes.ts

      # The extensions this fork adds ship inside the app: `out/**` is what the package copies, and the webview bundles
      # are esbuild output under each module's own `out/` — which the gulp packaging chain does not produce.
      # Built-in marketplace extensions need no step here; the packaging task downloads and bundles them itself.
      #
      # One command per step: a Windows runner's default shell keeps going after a command that exits non-zero, so a
      # single block hides the failure that mattered and reports only what the next command tripped over.
      - name: Compile the extensions
        run: npm run gulp compile-extensions

      - name: Bundle the webviews
        run: npm run build-webviews

      # The libraries a module's *webview* needs are devDependencies — esbuild inlines them into the bundle in
      # `out/webview/` — but `npm ci` installs them anyway, and packaging copies whatever is on disk. Two things come of
      # that: files copied into the application that it never loads, and a walk that opens every one of them (the `EMFILE`
      # that killed all three platforms). Pruning to production dependencies leaves `temco-docs` at 2,076 files,
      # `temco-editor` at 1,067 and `temco-workbench` at 84. `temco-learn` is pruned without `--omit=dev` because its
      # manifest declares no dependencies at all: anything in its `node_modules` is a leftover from an older lockfile, and
      # `npm prune` is what removes it.
      #
      # `npm prune` only trusts the manifest, so it does nothing for a commit that still lists those libraries as
      # dependencies — and every commit up to and including the one `v1.144.0` first pointed at does. That is how a run
      # ended with `EMFILE` inside `@fluentui` and then reported the *next* command's `ENOENT` instead.
      # `build/drop-webview-libraries.mjs` drops them by name as well, and counts what is left: a module that would hand
      # the packaging walk more files than it can open now fails this step in seconds, by name.
      - name: Drop the libraries the package does not ship
        run: |
          npm prune --omit=dev --no-audit --no-fund --prefix extensions/temco-docs
          npm prune --omit=dev --no-audit --no-fund --prefix extensions/temco-editor
          npm prune --omit=dev --no-audit --no-fund --prefix extensions/temco-workbench
          npm prune --no-audit --no-fund --prefix extensions/temco-learn
          node build/drop-webview-libraries.ts

      - name: Package the application (Windows)
        if: matrix.platform == 'win32'
        run: npm run gulp vscode-win32-x64-min

      # `code.iss` ships `tools\*` next to the application — the updater the installer runs — and the files come from
      # `build/win32/{inno_updater.exe,vcruntime140.dll}`. Without this task Inno aborts with
      # `No files found matching "...\VSCode-win32-x64\tools\*"`, which is how the first run that packaged the application
      # successfully ended.
      - name: Place the updater the installer ships (Windows)
        if: matrix.platform == 'win32'
        run: npm run gulp vscode-win32-x64-inno-updater

      - name: Build the installer (Windows)
        if: matrix.platform == 'win32'
        run: npm run gulp vscode-win32-x64-user-setup

      # The limit is a guard, not the cure: the cure is the step above, which leaves every module with at most a couple
      # of thousand files. It is set in the same shell as the command because it is a property of the process, not of the
      # runner, and Windows cannot raise it at all — which is why the tree is what has to stay small.
      - name: Package the application (Linux)
        if: matrix.platform == 'linux'
        run: |
          ulimit -n 65536
          npm run gulp vscode-linux-x64-min

      - name: Prepare the .deb (Linux)
        if: matrix.platform == 'linux'
        run: npm run gulp vscode-linux-x64-prepare-deb

      - name: Build the .deb (Linux)
        if: matrix.platform == 'linux'
        run: npm run gulp vscode-linux-x64-build-deb

      - name: Package the application (macOS)
        if: matrix.platform == 'darwin'
        run: |
          ulimit -n 65536
          npm run gulp vscode-darwin-arm64-min

      # One staging folder per platform, so the release job has one shape to collect.
      - name: Stage the tool server
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.platform }}-${{ matrix.arch }}" in
            win32-x64) rid=win-x64 ;;
            linux-x64) rid=linux-x64 ;;
            darwin-arm64) rid=osx-arm64 ;;
            *) echo "::error::No tool server is published for ${{ matrix.platform }}-${{ matrix.arch }}."; exit 1 ;;
          esac
          # Self-contained and not trimmed, because `WithToolsFromAssembly()` reflects over the tool classes and a
          # single-file build extracts the SQLite native library at run time. A plain folder is what ships.
          dotnet publish tools/temco-mcp/Temco.Mcp.csproj -c Release -r "$rid" --self-contained true \
            -p:PublishSingleFile=false -o "tool-server/$rid"
          mkdir -p staging
          tar -czf "staging/temco-mcp-$rid.tar.gz" -C "tool-server/$rid" .
          ls -l "staging/temco-mcp-$rid.tar.gz"

      - name: Stage (Windows)
        if: matrix.platform == 'win32'
        shell: pwsh
        run: |
          $version = "${{ needs.guard.outputs.version }}"
          New-Item -ItemType Directory -Force staging | Out-Null
          Compress-Archive -Path ../VSCode-win32-x64 -DestinationPath "staging/TemcoPlatform-win32-x64-$version.zip"
          Get-ChildItem .build/win32-x64/user-setup -Filter *.exe | Copy-Item -Destination staging
          Get-ChildItem staging | Select-Object Name, Length

      - name: Stage (Linux)
        if: matrix.platform == 'linux'
        run: |
          set -euo pipefail
          version="${{ needs.guard.outputs.version }}"
          mkdir -p staging
          tar -czf "staging/temco-platform-linux-x64-$version.tar.gz" -C .. VSCode-linux-x64
          deb="$(find .build/linux/deb -name '*.deb' -type f | head -n 1)"
          if [ -z "$deb" ]; then echo "::error::The .deb build produced no package."; exit 1; fi
          cp "$deb" "staging/temco-platform_${version}_amd64.deb"
          ls -l staging

      - name: Stage (macOS)
        if: matrix.platform == 'darwin'
        run: |
          set -euo pipefail
          version="${{ needs.guard.outputs.version }}"
          mkdir -p staging
          app="$(find ../VSCode-darwin-arm64 -maxdepth 1 -name '*.app' | head -n 1)"
          if [ -z "$app" ]; then echo "::error::The macOS build produced no .app bundle."; exit 1; fi
          ditto -c -k --keepParent "$app" "staging/TemcoPlatform-darwin-arm64-$version.zip"
          ls -l staging

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-${{ matrix.arch }}
          path: staging/*
          if-no-files-found: error
          retention-days: 14

  release:
    needs: [guard, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Not left to the `needs` default, on purpose. A job that `needs` another job is skipped when that job fails **or
    # is cancelled**, and a macOS job cancelled while it waits for a runner it never gets is exactly that: run
    # 42890122529 built Windows and Linux, then skipped this job and published nothing — so a tag produced no release,
    # and `continue-on-error` on the build job did not change that, because cancellation is not failure.
    #
    # Running anyway is safe because the step below refuses to publish when a package a release must have is missing:
    # a broken Windows or Linux build still fails here, by name, before a draft is touched.
    if: ${{ !cancelled() && needs.guard.result == 'success' }}
    steps:
      # Whatever the build produced, and nothing invented: when a platform never ran its artifact is simply absent.
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: release
          merge-multiple: true

      - name: Check the packages a release must have
        run: |
          set -euo pipefail
          mkdir -p release
          missing=''
          add() { missing="${missing}${missing:+, }$1"; }
          ls release/TemcoPlatform-win32-x64-*.zip >/dev/null 2>&1 || add 'Windows zip'
          ls release/*.exe                      >/dev/null 2>&1 || add 'Windows installer'
          ls release/*amd64.deb                 >/dev/null 2>&1 || add 'Linux .deb'
          ls release/temco-platform-linux-x64-*.tar.gz >/dev/null 2>&1 || add 'Linux tarball'
          if [ -n "$missing" ]; then
            echo "::error::Nothing was published: the build produced no $missing. Fix that platform and run this again."
            exit 1
          fi
          ls -l release

      # The notes say what is actually in the draft, rather than what the plan was: an optional platform that never got
      # a runner would otherwise leave a release that silently lacks its arm64 package.
      - name: Note which platforms are in this build
        run: |
          set -euo pipefail
          if ls release/TemcoPlatform-darwin-arm64-*.zip >/dev/null 2>&1; then
            echo "" > release/PLATFORMS.md
            echo "macOS arm64 is included." >> release/PLATFORMS.md
          else
            echo "" > release/PLATFORMS.md
            echo "**macOS arm64 is not in this build.** Only Windows and Linux are built by a tag; the Apple silicon" >> release/PLATFORMS.md
            echo "package is made when the Release workflow is run by hand with \`macos\` set to true. Run it and this" >> release/PLATFORMS.md
            echo "release gains the zip — a tag does not stop for a runner that has not been handed out." >> release/PLATFORMS.md
          fi
          cat release/PLATFORMS.md

      - name: Write the release notes
        run: |
          cat > release/NOTES.md <<'EOF'
          Built from the tag by GitHub Actions. Every asset is unsigned: there is no code-signing certificate for this
          application yet, so Windows shows "unknown publisher" on first run and macOS asks for a right-click → Open
          (or `xattr -d com.apple.quarantine`). These are the files this build produced:

          - `TemcoPlatform-win32-x64-<version>.zip` — run `Temco Platform.exe` from the unpacked folder
          - a Windows installer `.exe` — per-user install, no admin rights
          - `temco-platform_<version>_amd64.deb` and `temco-platform-linux-x64-<version>.tar.gz`
          - `TemcoPlatform-darwin-arm64-<version>.zip` — Apple silicon only
          - `temco-mcp-<platform>.tar.gz` — the assistant's tool server, per platform; the application downloads
            and verifies the one for its own machine the first time the assistant needs it

          Nothing here updates itself: a new version is a new download.
          EOF
          cat release/PLATFORMS.md >> release/NOTES.md

      # A draft, so the files can be checked before anyone is pointed at them.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.guard.outputs.tag }}
          name: Temco Platform ${{ needs.guard.outputs.version }}
          body_path: release/NOTES.md
          files: |
            release/*.exe
            release/*.zip
            release/*.deb
            release/*.tar.gz
          draft: true
          fail_on_unmatched_files: true
